name: Update profile assets

on:
  schedule:
    - cron: '30 6 * * *'  # once a day at 12:00 IST, so the profile history stays quiet
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/gen-banner.mjs ${{ github.repository_owner }}
          node scripts/gen-tide.mjs ${{ github.repository_owner }}
          node scripts/gen-projects.mjs ${{ github.repository_owner }}
      - name: Commit changes
        run: |
          git config user.name "Atul013"
          git config user.email "141022002+Atul013@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || git commit -m "chore: refresh generated assets"
          git push
